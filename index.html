<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description"
content="Gazillion: tägliche Kategorien, seltene Antworten und dein Aufstieg in neue Welten.">
<title>Gazillion – seltene Antworten, neue Welten</title>

<style>
:root{
  --bg:#f5f4ee;
  --ink:#203830;
  --green:#216c58;
  --line:#dce5da;
  --muted:#63766b;
  --gold:#e9ac61;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:17px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button,input{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
header{
  max-width:1100px;margin:auto;padding:22px;
  display:flex;justify-content:space-between;gap:15px;align-items:center;
}
.brand{
  font-size:30px;font-weight:850;letter-spacing:-1px;
  border:0;background:none;color:var(--ink);padding:0;
}
.brand span{color:var(--gold)}
nav{display:flex;gap:13px;flex-wrap:wrap}
nav button{
  border:0;background:none;color:var(--green);
  font-size:14px;padding:4px 0;
}
main{max-width:1000px;margin:25px auto 65px;padding:0 22px}
h1{
  font-size:clamp(36px,6vw,61px);line-height:1.1;
  letter-spacing:-2px;margin:18px 0 24px;
}
h2{font-size:24px;line-height:1.3}
h3{font-size:18px;line-height:1.4}
p{margin:12px 0}
.grid{
  display:grid;
  grid-template-columns:minmax(0,1fr) 310px;
  gap:25px;
}
.card{
  padding:25px;border:1px solid var(--line);
  border-radius:20px;background:white;margin:18px 0;
}
.eyebrow{
  font-size:12px;letter-spacing:2px;text-transform:uppercase;
  color:var(--green);font-weight:750;
}
.muted{font-size:14px;color:var(--muted)}
.notice{
  background:#fff1d9;border-radius:12px;
  padding:15px;font-size:14px;
}
.primary,.secondary{
  border-radius:10px;padding:12px 17px;
  margin:7px 6px 7px 0;
}
.primary{
  background:var(--green);color:white;
  border:1px solid var(--green);
}
.secondary{
  background:white;color:var(--green);
  border:1px solid var(--line);
}
label{display:block;font-weight:650;margin-top:15px}
input{
  display:block;width:100%;padding:14px;
  margin:7px 0 13px;border:1px solid #95aa9a;
  border-radius:10px;color:var(--ink);background:white;
}
.stats{
  display:grid;grid-template-columns:repeat(3,1fr);gap:9px;
  margin:20px 0;
}
.stat{
  text-align:center;background:white;padding:15px 5px;
  border:1px solid var(--line);border-radius:13px;
}
.stat strong{display:block;font-size:27px}
.stat span{font-size:12px;color:var(--muted)}
.points{
  font-size:65px;line-height:1.1;font-weight:850;
  letter-spacing:-3px;margin:18px 0;
}
.points small{font-size:20px;letter-spacing:0;font-weight:500}
.timer{
  display:inline-block;background:#e3f0e7;
  border-radius:20px;padding:7px 14px;
  font-weight:800;font-variant-numeric:tabular-nums;
}
.timer.urgent{background:#ffdfd3;color:#a43e26}
.track{
  height:7px;background:#e4e9e1;border-radius:10px;
  overflow:hidden;margin:12px 0;
}
.fill{height:100%;background:var(--green);width:100%}
.question{font-size:clamp(27px,4vw,36px);letter-spacing:-1px}
.suggestion{
  background:#fff5e4;border:1px solid #ecd0a4;
  padding:15px;border-radius:12px;margin-top:15px;
}
.badge{
  display:inline-block;padding:5px 11px;
  background:#e4f0e7;border-radius:20px;font-size:13px;
}
.badge.zero{background:#ffebe2}
.world-card{
  align-self:start;position:sticky;top:20px;margin:18px 0;
}
.world-heading{
  display:flex;justify-content:space-between;
  gap:10px;font-size:14px;
}
.world{
  height:455px;position:relative;overflow:hidden;
  border-radius:22px;background:#bde1e8;
  margin-top:10px;border:1px solid #cbded0;
}
.sky{position:absolute;inset:0;transition:background 1s}
.stars{
  position:absolute;inset:0;opacity:0;
  transition:opacity 1s;
  background-image:radial-gradient(white 1px,transparent 2px);
  background-size:35px 43px;
}
.sun{
  position:absolute;right:25px;top:35px;
  width:48px;height:48px;border-radius:50%;
  background:#ffe3a0;transition:opacity 1s;
}
.layer{
  position:absolute;inset:0;
  transition:transform 1.1s ease;
}
.cloud{
  position:absolute;width:100px;height:27px;
  border-radius:40px;background:#ffffffd9;
}
.cloud:before{
  content:"";position:absolute;width:43px;height:35px;
  left:17px;bottom:5px;border-radius:50%;background:inherit;
}
.c1{top:85px;left:-15px}
.c2{top:210px;right:-18px}
.c3{top:-70px;right:20px}
.c4{top:-210px;left:10px}
.terrain{
  position:absolute;left:-20px;right:-20px;bottom:0;
  height:70px;background:#548665;border-radius:50% 50% 0 0;
}
.trees{
  position:absolute;bottom:50px;left:12px;
  color:#325b43;font-size:48px;letter-spacing:12px;
}
.house{
  position:absolute;bottom:40px;right:25px;
  width:48px;height:47px;background:#d9b88c;
  border-top:17px solid #9e6451;
}
.mountains{
  position:absolute;bottom:-20px;left:-50px;
  width:400px;height:260px;
  background:linear-gradient(135deg,#e3ece5 0 20%,#8baaa2 21% 50%,#648b86 51%);
  clip-path:polygon(0 100%,30% 10%,47% 52%,70% 0,100% 100%);
  opacity:0;transition:opacity 1s,transform 1.1s;
}
.waterfall{
  position:absolute;bottom:0;left:140px;width:12px;height:130px;
  background:linear-gradient(#c4effb,#71bcda);
  opacity:0;transition:opacity 1s;
}
.aurora{
  position:absolute;inset:30px -60px auto;height:140px;
  background:linear-gradient(120deg,transparent,#74f1ba99,#b88bff99,transparent);
  filter:blur(18px);transform:rotate(-20deg);
  opacity:0;transition:opacity 1s;
}
.portal{
  position:absolute;top:30px;left:calc(50% - 35px);
  width:70px;height:95px;border:6px solid #fff0aa;
  border-radius:50%;box-shadow:0 0 30px #fff0aa;
  opacity:0;transition:opacity 1s;
}
.balloon{
  position:absolute;bottom:38px;left:calc(50% - 30px);
  width:60px;height:94px;z-index:5;
  transition:transform 1.1s cubic-bezier(.2,.8,.2,1);
}
.envelope{
  width:60px;height:68px;border-radius:50% 50% 45% 45%;
  background:linear-gradient(90deg,#bd613c,#e99761,#f6c27b,#e99761,#bd613c);
}
.basket{
  position:absolute;bottom:0;left:17px;width:26px;height:18px;
  background:#8c6546;border-radius:3px 3px 7px 7px;
}
.basket:before{
  content:"";position:absolute;bottom:16px;left:0;
  width:26px;height:15px;
  border-left:1px solid #76563b;border-right:1px solid #76563b;
}
.milestone{
  position:absolute;top:43%;left:12px;right:12px;z-index:7;
  text-align:center;background:#ffffffed;
  padding:14px;border-radius:14px;font-weight:750;
  opacity:0;transform:translateY(15px);transition:all .35s;
}
.milestone.show{opacity:1;transform:translateY(0)}
.zone{text-align:center;font-size:14px;margin:9px 0;font-weight:650}
.goal{text-align:center;font-size:12px;color:var(--muted)}
.result-row{padding:15px 0;border-bottom:1px solid var(--line)}
.result-row:last-child{border-bottom:0}
details{margin:18px 0}
summary{cursor:pointer;font-weight:650}
footer{
  max-width:1000px;margin:auto;padding:22px;
  font-size:12px;color:var(--muted);

#toast{
  position:fixed;bottom:20px;left:50%;
  transform:translateX(-50%);background:var(--ink);
  color:white;border-radius:10px;padding:12px 16px;
  max-width:90%;z-index:20;

[hidden]{display:none!important}
@media(max-width:740px){
  header{align-items:flex-start;flex-direction:column}
  .grid{grid-template-columns:1fr}
  .world-card{position:relative;top:0}
  .world{height:315px}

@media(prefers-reduced-motion:reduce){

</style>
</head>

function esc(value){
  return String(value ?? "").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

function norm(value){
  return String(value).normalize("NFKC").toLowerCase()
    .replace(/ä/g,"ae").replace(/ö/g,"oe")
    .replace(/ü/g,"ue").replace(/ß/g,"ss")
    .replace(/[‐‑–—]/g,"-")
    .trim().replace(/\s+/g," ");
}

function today(now = new Date()){
  const parts = new Intl.DateTimeFormat("en-GB",{
    timeZone:"Europe/Berlin",
    year:"numeric",month:"2-digit",day:"2-digit"
  }).formatToParts(now);
  const get = type => parts.find(p=>p.type===type).value;
  return `${get("year")}-${get("month")}-${get("day")}`;
}

function dayNumber(key){
  const [y,m,d] = key.split("-").map(Number);
  return Math.floor(Date.UTC(y,m-1,d)/86400000);
}

function previous(key){
  return new Date((dayNumber(key)-1)*86400000)
    .toISOString().slice(0,10);
}

function formatDate(key){
  return new Intl.DateTimeFormat("de-DE",{
    dateStyle:"long",timeZone:"UTC"
  }).format(new Date(key+"T12:00:00Z"));
}

function questionsFor(key){
  const index = dayNumber(key)-dayNumber(START_DATE);

    day.answers.length<=5 &&
    day.answers.every(a=>a&&Number.isFinite(a.points)) &&
    ["question","feedback","done"].includes(day.phase) &&
    (day.phase!=="question" || Number.isFinite(day.deadline));
}

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return newState();
    const parsed = JSON.parse(raw);
    if(parsed.version!==3 || !parsed.days ||
       typeof parsed.days!=="object" || Array.isArray(parsed.days) ||
       !Object.values(parsed.days).every(validDay)){
      throw new Error("Ungültiger lokaler Spielstand");
    }
    return parsed;
  }catch(error){
    storageOK = false;
    return newState();
  }
}

let state = load();

function toast(text){
  const el = document.getElementById("toast");
  el.textContent = text;
  el.hidden = false;
  clearTimeout(toastHandle);
  toastHandle = setTimeout(()=>el.hidden=true,5000);
}

function save(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
    return true;
  }catch(error){
    storageOK = false;
    toast("Speichern nicht möglich. Bitte lokalen Browserspeicher erlauben.");
    return false;
  }
}

function stop(){
  clearInterval(timer);
  timer = null;
  animationHandles.forEach(clearTimeout);
  animationHandles = [];
}

function total(day){
  return day.answers.reduce((sum,a)=>sum+a.points,0);
}

function expireOld(){
  let changed = false;
  const key = today();

  for(const [date,day] of Object.entries(state.days)){
    if(date<key && !day.finished){
      while(day.answers.length<5){
        day.answers.push({
          raw:"",canonical:"",points:0,reason:"day-end"
        });
      }
      day.finished = true;
      day.phase = "done";
      day.deadline = null;
      changed = true;
    }
  }

  if(changed) save();
}

function entries(){
  return Object.entries(state.days)
    .filter(([,day])=>day.finished)
    .sort(([a],[b])=>b.localeCompare(a));
}

function statistics(){
  const list = entries();
  const scores = list.map(([,day])=>total(day));
  let cursor = today();

  if(!state.days[cursor]?.finished) cursor=previous(cursor);

  let streak=0;
  while(state.days[cursor]?.finished){
    streak++;
    cursor=previous(cursor);
  }

  return {
    played:list.length,
    streak,
    best:scores.length?Math.max(...scores):0,
    average:scores.length?
      Math.round(scores.reduce((a,b)=>a+b,0)/scores.length):0
  };
}

function distance(a,b){
  const m = Array.from({length:a.length+1},
    ()=>Array(b.length+1).fill(0));

  for(let i=0;i<=a.length;i++) m[i][0]=i;
  for(let j=0;j<=b.length;j++) m[0][j]=j;

  for(let i=1;i<=a.length;i++){
    for(let j=1;j<=b.length;j++){
      m[i][j]=Math.min(
        m[i-1][j]+1,
        m[i][j-1]+1,
        m[i-1][j-1]+(a[i-1]===b[j-1]?0:1)
      );
      if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]){
        m[i][j]=Math.min(m[i][j],m[i-2][j-2]+1);
      }
    }
  }
  return m[a.length][b.length];
}

function exactAnswer(question,text){
  const input = norm(text);
  if(!input) return null;
  return question.answers.find(a=>
    [a[0],...a[2]].some(alias=>norm(alias)===input)
  ) || null;
}

function similarAnswer(question,text){
  const input=norm(text);
  if(input.length<4) return null;

  const ranked=question.answers.map(answer=>{
    const aliases=[answer[0],...answer[2]]
      .map(norm).filter(alias=>alias.length>=4);

    return {
      answer,
      score:aliases.length?
        Math.min(...aliases.map(alias=>distance(input,alias))):Infinity
    };
  }).sort((a,b)=>a.score-b.score);

  const first=ranked[0];
  const limit=input.length>=8?2:1;

  if(!first||first.score>limit) return null;
  if(ranked[1]&&ranked[1].score===first.score) return null;
  return first.answer;
}

function paintWorld(height){
  const container=document.getElementById("world");
  if(!container) return;

  height=Math.max(0,Math.min(500,height));
  const zone=[...ZONES].reverse().find(z=>height>=z.min);
  const next=ZONES.find(z=>z.min>height);
  const travel=container.clientHeight-150;

  document.getElementById("sky").style.background=zone.sky;
  document.getElementById("height").textContent=height+" m";
  document.getElementById("zone").textContent=zone.name;
  document.getElementById("goal").textContent=next?
    `Noch ${next.min-height} m bis „${next.name}“`:
    "Alle Höhenstufen erreicht.";

  document.getElementById("balloon").style.transform=
    `translateY(-${height/500*travel}px)`;

  document.getElementById("land").style.transform=
    `translateY(${height*1.7}px)`;

  document.getElementById("clouds").style.transform=
    `translateY(${height*.65}px)`;

  const mountain=document.getElementById("mountains");
  mountain.style.opacity=height>=100&&height<300?"1":"0";
  mountain.style.transform=
    `translateY(${Math.max(0,height-100)*.7}px)`;

  document.getElementById("waterfall").style.opacity=
    height>=100&&height<200?"1":"0";

  document.getElementById("stars").style.opacity=
    height>=300?".85":"0";

  document.getElementById("sun").style.opacity=
    height>=400?"0":"1";

  document.getElementById("aurora").style.opacity=
    height>=400?"1":"0";

  document.getElementById("portal").style.opacity=
    height>=500?"1":"0";
}

function animateWorld(from,to){
  paintWorld(from);

  const reduced=window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  ).matches;

  const crossed=ZONES.filter(z=>z.min>from&&z.min<=to);

  const steps=(reduced?[to]:[...crossed.map(z=>z.min),to])
    .filter((v,i,a)=>i===0||v!==a[i-1]);

  steps.forEach((height,index)=>{
    animationHandles.push(setTimeout(()=>{
      paintWorld(height);
      const el=document.getElementById("milestone");
      if(!el) return;

      const zone=ZONES.find(z=>z.min===height);
      el.textContent=zone&&height>from?
        `Neue Höhenstufe: ${zone.name}`:
        to>from?`+${to-from} Meter`:"Höhe gehalten";

      el.classList.add("show");
    },reduced?0:120+index*1250));
  });

  animationHandles.push(setTimeout(()=>{
    document.getElementById("milestone")?.classList.remove("show");
  },reduced?3500:1800+steps.length*1250));
}

function navigate(next){
  view=next;
  candidate=null;
  render();
  window.scrollTo({top:0});
}

function start(){
  if(!storageOK){
    toast("Bitte erlaube lokalen Browserspeicher.");
    return;
  }

  state=load();
  if(!storageOK){render();return;}

  const key=today();
  const packet=questionsFor(key);

  if(!state.days[key]){
    if(!packet){render();return;}

    state.days[key]={
      questions:JSON.parse(JSON.stringify(packet)),
      answers:[],
      phase:"question",
      deadline:Date.now()+25000,
      finished:false
    };

    if(!save()){
      delete state.days[key];
      render();
      return;
    }
  }

  selectedDate=key;
  navigate(state.days[key].finished?"result":"play");
}

function play(){
  const key=today();
  const day=state.days[key];

  if(!day){view="home";home();return;}
  if(day.finished){selectedDate=key;result();return;}
  if(day.phase==="feedback"){feedback(day);return;}

  const index=day.answers.length;
  const q=day.questions[index];

  app.innerHTML=`
    <div class="grid">
      <section>
        <p class="eyebrow">Frage ${index+1} von 5</p>
        <span class="timer" id="seconds" role="timer">25 s</span>
        <div class="track">
          <div class="fill" id="fill"></div>
        </div>
        <section class="card">
          <h1 class="question">${esc(q.text)}</h1>
          <form id="answer-form">
            <label for="answer">Deine Antwort</label>
            <input id="answer" maxlength="120"
              autocomplete="off" spellcheck="false">
            <button class="primary" type="submit">
              Antwort prüfen
            </button>
            <button class="secondary" type="button"
              data-action="skip">Überspringen</button>
          </form>
          <div id="suggestion" aria-live="polite"></div>
          <p class="muted">
            Richtige Schreibweisen werden direkt abgegeben.
            Korrekturvorschläge musst du bestätigen.
            Die Zeit läuft dabei weiter.
          </p>
        </section>
      </section>
      ${world(total(day))}
    </div>`;

  paintWorld(total(day));

  document.getElementById("answer-form").onsubmit=event=>{
    event.preventDefault();
    checkAnswer(key,index);
  };

  document.getElementById("answer").oninput=()=>{
    candidate=null;
    document.getElementById("suggestion").replaceChildren();
  };

  document.getElementById("answer").focus();

  function tick(){
    if(today()!==key){
      expireOld();
      navigate("home");
      toast("Ein neuer Spieltag hat begonnen.");
      return;
    }

    const remaining=Math.max(0,day.deadline-Date.now());
    const label=document.getElementById("seconds");
    const fill=document.getElementById("fill");
    if(!label||!fill) return;

    label.textContent=Math.ceil(remaining/1000)+" s";
    label.classList.toggle("urgent",remaining<=5000);
    fill.style.width=Math.min(100,remaining/25000*100)+"%";

    if(remaining<=0){
      commitAnswer(key,index,"",null,"timeout");
    }
  }

  tick();

  if(state.days[key]?.phase==="question"&&view==="play"){
    timer=setInterval(tick,100);
  }
}

function checkAnswer(key,index){
  const day=state.days[key];
  if(!day||day.phase!=="question") return;

  if(Date.now()>=day.deadline){
    commitAnswer(key,index,"",null,"timeout");
    return;
  }

  const raw=document.getElementById("answer").value.trim();
  const question=day.questions[index];

  if(!raw){
    commitAnswer(key,index,"",null,"skip");
    return;
  }

  const exact=exactAnswer(question,raw);

  if(exact){
    commitAnswer(key,index,raw,exact,"answer");
    return;
  }

  const suggestion=similarAnswer(question,raw);

  if(suggestion){
    candidate={key,index,raw,answer:suggestion};

    document.getElementById("suggestion").innerHTML=`
      <section class="suggestion">
        <p>Meinst du <strong>${esc(suggestion[0])}</strong>?</p>
        <button class="primary" data-action="accept">
          Korrigiert abgeben
        </button>
        <button class="secondary" data-action="original">
          Original abgeben
        </button>
        <p class="muted">Oder ändere deine Eingabe. Die Zeit läuft weiter.</p>
      </section>`;
    return;
  }

  commitAnswer(key,index,raw,null,"answer");
}

function commitAnswer(key,index,raw,answer,reason){
  if(locked) return;
  locked=true;
  stop();

  const fresh=load();

  if(!storageOK){
    locked=false;
    render();
    return;
  }

  state=fresh;
  const day=state.days[key];

  if(!day||day.finished||day.phase!=="question"||
     day.answers.length!==index){
    locked=false;
    render();
    return;
  }

  if(today()!==key){
    expireOld();
    locked=false;
    navigate("home");
    return;
  }

  if(Date.now()>=day.deadline){
    raw="";
    answer=null;
    reason="timeout";
  }

  const backup=JSON.parse(JSON.stringify(day));
  const before=total(day);

  day.answers.push({
    raw,
    canonical:answer?answer[0]:"",
    points:answer?answer[1]:0,
    reason
  });

  day.deadline=null;
  day.phase="feedback";

  if(!save()){
    state.days[key]=backup;
    locked=false;
    render();
    return;
  }

  candidate=null;
  locked=false;
  view="play";
  feedback(day,before);
}

function feedback(day,from=total(day)){
  stop();

  const index=day.answers.length-1;
  const answer=day.answers[index];
  const q=day.questions[index];

  const title=answer.reason==="timeout"?
    "Die Zeit ist abgelaufen.":
    answer.canonical?"Deine Antwort ist richtig.":
    answer.reason==="skip"?"Frage übersprungen.":
    "Diese Antwort wurde nicht erkannt.";

  app.innerHTML=`
    <div class="grid">
      <section>
        <p class="eyebrow">Auswertung · Frage ${index+1} von 5</p>
        <section class="card">
          <h2>${esc(title)}</h2>
          <p>${esc(q.text)}</p>
          <p>Deine Antwort:

          </p>

            </p>`:""}
          <div class="points">

          </div>

            ${esc(LEVELS[answer.points])}

          <p>Insgesamt ${total(day)} Punkte und Meter.</p>
          <button class="primary" data-action="next">
            ${day.answers.length===5?
              "Gesamtergebnis ansehen":"Nächste Frage starten · 25 s"}
          </button>
          <p class="muted">
            Hier läuft kein Timer.
            Die nächste Frage beginnt erst mit deinem Klick.
          </p>
          ${!answer.canonical&&answer.raw?`
            <p class="muted">
              Die Antwortliste ist noch nicht vollständig.
              „Nicht erkannt“ bedeutet nicht zwingend sachlich falsch.
            </p>`:""}
        </section>
      </section>
      ${world(from)}
    </div>`;

  animateWorld(from,total(day));
}

function nextQuestion(){
  state=load();
  if(!storageOK){render();return;}

  const key=today();
  const day=state.days[key];

  if(!day||day.phase!=="feedback"){
    navigate("home");
    return;
  }

  const backup=JSON.parse(JSON.stringify(day));

  if(day.answers.length===5){
    day.finished=true;
    day.phase="done";
    selectedDate=key;

    if(save()) navigate("result");
    else state.days[key]=backup;
  }else{
    day.phase="question";
    day.deadline=Date.now()+25000;

    if(save()) navigate("play");
    else state.days[key]=backup;
  }
}

        Supabase-Anbindung oder gemeinsame Spieldatenbank.
      </p>
      <p>
        Antworten stehen im Quellcode.
        Browserdaten und Gerätezeit lassen sich verändern.
        Die Tagessperre ist daher kein manipulationssicherer Schutz.
        Mehrere Tabs können ebenfalls keine verlässliche
        Teilnahmebegrenzung garantieren.
      </p>
      <p>
        Offene Antwortlisten sind nicht vollständig.
        Eine richtige Antwort kann deshalb als „nicht erkannt“ gelten.
      </p>
      <p>
        Diese Anwendung macht keine eigenen externen API-Aufrufe.
        Der Website-Hostingdienst liefert die Seite weiterhin aus.
      </p>
    </details>`;
}

function render(){
  stop();
  expireOld();

  if(view==="play") play();
  else if(view==="result") result();
  else if(view==="stats") statsView();
  else if(view==="rules") rules();
  else home();
}

async function share(){
  const key=selectedDate||today();
  const day=state.days[key];
  if(!day?.finished) return;

  const text=[
    "Gazillion · "+formatDate(key),
    total(day)+"/500 Punkte",
    total(day)+" Meter erreicht",
    day.answers.map(a=>a.points).join(" · ")
  ].join("\n");

  try{
    await navigator.clipboard.writeText(text);
    toast("Ergebnis kopiert.");
  }catch(error){
    window.prompt("Ergebnis kopieren:",text);
  }
}

document.addEventListener("click",event=>{
  const navigation=event.target.closest("[data-view]");

  if(navigation){
    navigate(navigation.dataset.view);
    return;
  }

  const resultButton=event.target.closest("[data-result]");

  if(resultButton){
    selectedDate=resultButton.dataset.result;
    navigate("result");
    return;
  }

  const button=event.target.closest("[data-action]");
  if(!button) return;

  const action=button.dataset.action;

  if(action==="start") start();
  else if(action==="next") nextQuestion();
  else if(action==="share") share();
  else if(action==="skip"){
    const key=today();
    const day=state.days[key];
    if(day) commitAnswer(key,day.answers.length,"",null,"skip");
  }else if(action==="accept"&&candidate){
    const c=candidate;
    commitAnswer(c.key,c.index,c.answer[0],c.answer,"corrected");
  }else if(action==="original"&&candidate){
    const c=candidate;
    commitAnswer(c.key,c.index,c.raw,null,"answer");
  }
});

window.addEventListener("storage",event=>{
  if(event.key===STORAGE_KEY||event.key===null){
    state=load();
    candidate=null;
    render();
  }
});

document.addEventListener("visibilitychange",()=>{
  if(!document.hidden){
    state=load();
    render();
  }
});

window.addEventListener("resize",()=>{
  const key=view==="result"?(selectedDate||today()):today();
  const day=state.days[key];
  paintWorld(day?total(day):0);
});

/*
  Hintergrundprüfung:
  Ein Timer läuft auch dann weiter, wenn innerhalb
  der Website gerade Statistik oder Regeln geöffnet sind.
*/
lastDay=today();

setInterval(()=>{
  const key=today();

  if(key!==lastDay){
    lastDay=key;
    expireOld();
    if(view==="play") view="home";
    render();
    toast("Ein neuer Spieltag hat begonnen.");
    return;
  }

  const day=state.days[key];

  if(view!=="play"&&day&&!day.finished&&
     day.phase==="question"&&Date.now()>=day.deadline){
    commitAnswer(key,day.answers.length,"",null,"timeout");
  }
},250);

try{
  render();
}catch(error){
  stop();
  app.innerHTML=`
    <section class="card">
      <h2>Das Spiel konnte nicht gestartet werden.</h2>
      <p>${esc(error.message||"Unbekannter Fehler")}</p>
      <p class="muted">
        Bitte kopiere diese Meldung, damit der Fehler geprüft werden kann.
      </p>
    </section>`;
}
</script>
</body>
</html>
