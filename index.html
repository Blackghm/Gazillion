<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta name="description" content="Gazillion: Fünf tägliche Fragen. Seltene Antworten bringen dich nach oben.">
<title>Gazillion – hoch hinaus</title>
<style>
:root {
  --bg:#f5f4ee;
  --paper:#fff;
  --ink:#203830;
  --muted:#61756b;
  --green:#216c58;
  --line:#dce5da;
  --gold:#e9ac61;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:17px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button,input { font:inherit; }
button { cursor:pointer; }
button:disabled { opacity:.55; cursor:default; }
:focus-visible { outline:3px solid var(--gold); outline-offset:4px; }
header {
  max-width:1100px;
  margin:auto;
  padding:23px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}
.brand {
  border:0;
  background:none;
  padding:0;
  color:var(--ink);
  font-size:30px;
  letter-spacing:-1.5px;
  font-weight:850;
}
.brand span { color:var(--gold); }
nav { display:flex; flex-wrap:wrap; gap:15px; }
nav button,.link {
  border:0;
  background:none;
  color:var(--green);
  padding:3px;
  font-size:14px;
}
main { max-width:1000px; margin:25px auto 60px; padding:0 23px; }
h1 {
  font-size:clamp(38px,6vw,62px);
  line-height:1.08;
  letter-spacing:-2px;
  margin:18px 0 23px;
}
h2 { font-size:24px; line-height:1.3; }
p { margin:12px 0; }
.eyebrow {
  color:var(--green);
  font-size:12px;
  font-weight:750;
  letter-spacing:2px;
  text-transform:uppercase;
}
.intro { font-size:20px; color:var(--muted); }
.card {
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:21px;
  padding:27px;
  margin:20px 0;
}
.grid { display:grid; grid-template-columns:minmax(0,1fr) 310px; gap:25px; }
.primary,.secondary {
  border-radius:11px;
  padding:13px 18px;
  margin:7px 6px 7px 0;
  font-weight:650;
}
.primary { border:1px solid var(--green); background:var(--green); color:white; }
.primary:hover:not(:disabled) { background:#174d40; }
.secondary { border:1px solid var(--line); background:white; color:var(--green); }
.muted { font-size:14px; color:var(--muted); }
.notice {
  padding:15px;
  border-radius:12px;
  background:#fff1d9;
  font-size:14px;
}
.chips { display:flex; flex-wrap:wrap; gap:8px; margin:22px 0; }
.chips span { border:1px solid var(--line); border-radius:25px; padding:6px 11px; font-size:13px; }
label { display:block; margin:18px 0 7px; font-weight:650; }
input {
  width:100%;
  padding:15px;
  border:1px solid #91a798;
  border-radius:11px;
  color:var(--ink);
  background:white;
}
.question { font-size:clamp(27px,4vw,37px); line-height:1.2; letter-spacing:-.8px; }
.time-head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.timer {
  min-width:67px;
  text-align:center;
  padding:6px 10px;
  background:#e5f2e8;
  border-radius:22px;
  font-weight:800;
  font-variant-numeric:tabular-nums;
}
.timer.urgent { background:#ffe3d9; color:#9b3424; }
.time-track { height:7px; border-radius:8px; overflow:hidden; background:#e6ebe3; margin:10px 0 22px; }
.time-fill { height:100%; width:100%; background:var(--green); transition:width .1s linear; }
.time-fill.urgent { background:#bf5e41; }
.suggestion {
  margin:15px 0;
  border:1px solid #e8cb9a;
  border-radius:12px;
  padding:15px;
  background:#fff7e9;
}
.points { font-size:65px; font-weight:850; line-height:1.1; letter-spacing:-3px; margin:17px 0; }
.points small { font-size:21px; letter-spacing:0; color:var(--muted); }
.badge { background:#e7f2e9; border-radius:25px; display:inline-block; font-size:13px; padding:5px 11px; }
.badge.zero { background:#fff0e8; }
.stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:20px 0; }
.stat { border:1px solid var(--line); border-radius:14px; background:white; padding:17px 8px; text-align:center; }
.stat strong { display:block; font-size:28px; }
.stat span { color:var(--muted); font-size:12px; }
.result-row { padding:17px 0; border-bottom:1px solid var(--line); }
.result-row:last-child { border:0; }
.result-row h3 { font-size:17px; margin:5px 0; }
.world-card { margin:20px 0; align-self:start; position:sticky; top:20px; }
.world-title { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-size:14px; }
.height-label { font-weight:800; font-variant-numeric:tabular-nums; }
.world {
  height:465px;
  position:relative;
  overflow:hidden;
  border:1px solid #cddfd6;
  border-radius:22px;
  background:#c9e9ef;
}
.sky {
  position:absolute;
  inset:0;
  transition:background 1.8s ease;
  background:linear-gradient(#87c8e7,#def3e4);
}
.sun { position:absolute; top:32px; right:26px; width:48px; height:48px; border-radius:50%; background:#ffe4a1; box-shadow:0 0 35px #ffe4a180; }
.stars { position:absolute; inset:0; opacity:0; transition:opacity 1.8s; background-image:radial-gradient(white 1px,transparent 2px); background-size:43px 51px; }
.scenery {
  position:absolute;
  inset:0;
  transition:transform 1.8s cubic-bezier(.2,.8,.2,1);
}
.cloud { position:absolute; width:90px; height:24px; background:#ffffffcf; border-radius:50px; }
.cloud::before { content:""; position:absolute; width:38px; height:38px; border-radius:50%; background:inherit; left:17px; bottom:3px; }
.cloud.c1 { top:85px; left:18px; }
.cloud.c2 { top:210px; right:-12px; width:110px; }
.cloud.c3 { top:-70px; right:35px; }
.cloud.c4 { top:-210px; left:5px; }
.mountain { position:absolute; bottom:27px; width:0; height:0; border-left:125px solid transparent; border-right:125px solid transparent; border-bottom:180px solid #7ca89b; }
.mountain.back { bottom:35px; left:-85px; border-bottom-color:#a1bfb1; border-bottom-width:220px; }
.mountain.front { right:-95px; }
.ground { position:absolute; bottom:0; left:0; right:0; height:50px; background:#508568; border-radius:50% 50% 0 0; }
.ruler { position:absolute; right:10px; top:12px; bottom:12px; width:9px; background:repeating-linear-gradient(to bottom,transparent 0,transparent 21px,#ffffff99 22px,#ffffff99 23px); }
.balloon {
  position:absolute;
  left:calc(50% - 33px);
  bottom:42px;
  width:66px;
  height:105px;
  transition:transform 1.8s cubic-bezier(.2,.8,.2,1);
  z-index:3;
  filter:drop-shadow(0 5px 5px #20403020);
}
.envelope { width:66px; height:76px; border-radius:50% 50% 46% 46%; background:linear-gradient(90deg,#bd613c 0%,#e99761 26%,#f6c27b 49%,#e99761 74%,#bd613c 100%); position:relative; }
.envelope::after { content:""; position:absolute; left:18px; bottom:-12px; width:29px; height:17px; border-left:1px solid #6b583f; border-right:1px solid #6b583f; }
.basket { position:absolute; width:29px; height:19px; background:#916b49; border-radius:2px 2px 7px 7px; bottom:0; left:18px; border-top:4px solid #735035; }
.world-caption { text-align:center; padding:10px; font-size:13px; color:var(--muted); }
.lift {
  position:absolute; top:45%; left:0; right:0; text-align:center; color:white;
  font-weight:850; font-size:31px; text-shadow:0 2px 7px #2349;
  opacity:0; pointer-events:none; z-index:4;
}
.lift.go { animation:lift 1.8s ease-out; }
@keyframes lift { 0%{opacity:0;transform:translateY(30px)} 20%{opacity:1} 80%{opacity:1} 100%{opacity:0;transform:translateY(-45px)} }
footer { max-width:1000px; margin:auto; padding:25px; font-size:12px; color:var(--muted); }
#toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:white; padding:12px 17px; border-radius:12px; z-index:20; max-width:90%; }
[hidden] { display:none!important; }
details { margin:18px 0; }
summary { cursor:pointer; font-weight:650; }
@media(max-width:740px) {
  header { align-items:flex-start; flex-direction:column; }
  .grid { grid-template-columns:minmax(0,1fr); gap:0; }
  .world-card { position:relative; top:0; }
  .world { height:310px; }
  .card { padding:22px; }
}
@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after { animation:none!important; transition:none!important; }
  .lift.go { opacity:1; }
}
</style>

const app = document.getElementById("app");
let view = "home";
let selectedDate = null;
let candidate = null;
let timer = null;
let toastTimer = null;
let animationTimers = [];
let storageOK = true;
let locked = false;

function esc(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

function norm(value) {
  return String(value).normalize("NFKC").toLowerCase()
    .replace(/ä/g,"ae").replace(/ö/g,"oe")
    .replace(/ü/g,"ue").replace(/ß/g,"ss")
    .replace(/[‐‑–—]/g,"-").trim().replace(/\s+/g," ");
}

function today(now = new Date()) {
  const parts = new Intl.DateTimeFormat("en-GB",{
    timeZone:"Europe/Berlin",
    year:"numeric",month:"2-digit",day:"2-digit"
  }).formatToParts(now);
  const get = type => parts.find(p => p.type === type).value;
  return `${get("year")}-${get("month")}-${get("day")}`;
}

function dayNumber(key) {
  const [y,m,d] = key.split("-").map(Number);
  return Math.floor(Date.UTC(y,m-1,d)/86400000);
}

function previous(key) {
  return new Date((dayNumber(key)-1)*86400000).toISOString().slice(0,10);
}

function formatDate(key) {
  return new Intl.DateTimeFormat("de-DE",{
    dateStyle:"long",timeZone:"UTC"
  }).format(new Date(key+"T12:00:00Z"));
}

function emptyState() {
  return {version:2,days:{}};
}

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return emptyState();
    const parsed = JSON.parse(raw);
    if (parsed.version !== 2 || !parsed.days ||
        typeof parsed.days !== "object") {
      throw new Error("Ungültiger Spielstand");
    }
    return parsed;
  } catch (error) {
    storageOK = false;
    return emptyState();
  }
}

let state = load();

function toast(text) {
  const el = document.getElementById("toast");
  el.textContent = text;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {el.hidden = true;},4500);
}

function save() {
  try {
    localStorage.setItem(KEY,JSON.stringify(state));
    return true;
  } catch (error) {
    storageOK = false;
    toast("Speichern nicht möglich. Bitte Browserspeicher erlauben.");
    return false;
  }
}

function dailyQuestions(key) {
  const pool = [...QUESTIONS];
  let seed = dayNumber(key) >>> 0;
  const random = () => {
    seed = (Math.imul(seed,1664525)+1013904223) >>> 0;
    return seed/4294967296;
  };
  for (let i=pool.length-1;i>0;i--) {
    const j = Math.floor(random()*(i+1));
    [pool[i],pool[j]] = [pool[j],pool[i]];
  }
  return pool.slice(0,5);
}

function total(day) {
  return day.answers.reduce((sum,a) => sum+a.points,0);
}

function completed() {
  return Object.entries(state.days)
    .filter(([,d]) => d.finished)
    .sort(([a],[b]) => b.localeCompare(a));
}

function stats() {
  const entries = completed();
  const scores = entries.map(([,d]) => total(d));
  let cursor = today();
  if (!state.days[cursor]?.finished) cursor = previous(cursor);
  let streak = 0;
  while (state.days[cursor]?.finished) {
    streak++;
    cursor = previous(cursor);
  }
  return {
    played:entries.length,
    best:scores.length ? Math.max(...scores) : 0,
    average:scores.length ?
      Math.round(scores.reduce((a,b) => a+b,0)/scores.length) : 0,
    streak
  };
}

function expireOldDays() {
  let changed = false;
  const key = today();
  for (const [date,day] of Object.entries(state.days)) {
    if (date < key && !day.finished) {
      while (day.answers.length < day.questions.length) {
        day.answers.push({
          raw:"",canonical:"",points:0,reason:"day-end"
        });
      }
      day.finished = true;
      day.phase = "done";
      day.deadline = null;
      changed = true;
    }
  }
  if (changed) save();
}

/* Editierdistanz mit vertauschten benachbarten Buchstaben. */
function distance(a,b) {
  const matrix = Array.from({length:a.length+1},
    () => Array(b.length+1).fill(0));
  for (let i=0;i<=a.length;i++) matrix[i][0] = i;
  for (let j=0;j<=b.length;j++) matrix[0][j] = j;

  for (let i=1;i<=a.length;i++) {
    for (let j=1;j<=b.length;j++) {
      matrix[i][j] = Math.min(
        matrix[i-1][j]+1,
        matrix[i][j-1]+1,
        matrix[i-1][j-1]+(a[i-1] === b[j-1] ? 0 : 1)
      );
      if (i>1 && j>1 &&
          a[i-1] === b[j-2] && a[i-2] === b[j-1]) {
        matrix[i][j] = Math.min(
          matrix[i][j],matrix[i-2][j-2]+1
        );
      }
    }
  }
  return matrix[a.length][b.length];
}

function exactAnswer(question,text) {
  const input = norm(text);
  if (!input) return null;
  return question.answers.find(a =>
    [a[0],...a[2]].some(alias => norm(alias) === input)
  ) || null;
}

function similarAnswer(question,text) {
  const input = norm(text);
  if (input.length < 4) return null;

  const ranked = question.answers.map(answer => {
    const variants = [answer[0],...answer[2]]
      .map(norm).filter(alias => alias.length >= 4);
    const score = variants.length ?
      Math.min(...variants.map(alias => distance(input,alias))) :
      Infinity;
    return {answer,score};
  }).sort((a,b) => a.score-b.score);

  const first = ranked[0];
  const limit = input.length >= 8 ? 2 : 1;

  if (!first || first.score > limit) return null;
  if (ranked[1] && ranked[1].score === first.score) return null;
  return first.answer;
}

function worldMarkup(height) {

    <aside class="world-card" aria-label="Dein Aufstieg">

}

function setWorld(height) {
  const balloon = document.getElementById("balloon");
  const world = document.getElementById("world");
  if (!balloon || !world) return;

  const fraction = Math.max(0,Math.min(height/500,1));
  const travel = Math.max(80,world.clientHeight-165);

  balloon.style.transform = `translateY(-${fraction*travel}px)`;
  document.getElementById("scenery").style.transform =
    `translateY(${fraction*320}px)`;

  const sky = document.getElementById("sky");
  sky.style.background = height >= 350
    ? "linear-gradient(#263354,#7795b9)"
    : height >= 200
      ? "linear-gradient(#72a8cf,#d4e9ed)"
      : "linear-gradient(#87c8e7,#def3e4)";

  document.getElementById("stars").style.opacity =
    height >= 350 ? "0.8" : "0";

  document.getElementById("height-label").textContent = height+" m";

  document.getElementById("zone").textContent =
    height >= 400 ? "Über den Wolken" :
    height >= 250 ? "Im hohen Himmel" :
    height >= 100 ? "Zwischen den Wolken" :
    height > 0 ? "Über den Baumwipfeln" : "Bereit zum Abheben";
}

function animateWorld(from,to) {
  setWorld(from);
  const reduced = window.matchMedia &&
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const id = setTimeout(() => {
    setWorld(to);
    if (to > from) {
      const el = document.getElementById("lift");
      if (el) {
        el.textContent = "+"+(to-from)+" m";
        el.classList.add("go");
      }
    }
  },reduced ? 0 : 100);

  animationTimers.push(id);
}

function clearTimers() {
  clearInterval(timer);
  timer = null;
  animationTimers.forEach(clearTimeout);
  animationTimers = [];
}

function navigate(next) {
  view = next;
  candidate = null;
  render();
  window.scrollTo({top:0});
}

function start() {
  if (!storageOK) {
    toast("Bitte erlaube den lokalen Browserspeicher.");
    return;
  }

  state = load();
  if (!storageOK) return;

  const key = today();
  if (!state.days[key]) {
    state.days[key] = {
      questions:dailyQuestions(key),
      answers:[],
      phase:"question",
      deadline:Date.now()+25000,
      finished:false
    };
    if (!save()) {
      delete state.days[key];
      render();
      return;
    }
  }

  selectedDate = key;
  navigate(state.days[key].finished ? "result" : "play");
}

function home() {
  const key = today();
  const day = state.days[key];
  const s = stats();

  const action = !storageOK
    ? `<p class="notice">Browserspeicher nicht verfügbar.
       Bitte erlaube ihn und lade die Seite neu.</p>`
    : `<button class="primary" data-action="start">${
        day?.finished ? "Heutiges Ergebnis ansehen" :
        day ? "Runde fortsetzen" : "Heutiges Spiel starten"
      }</button>`;

  app.innerHTML = `
    <div class="grid">
      <section>
        <p class="eyebrow">Das tägliche Wissensspiel</p>
        <h1>Seltene Antworten.<br>Große Höhen.</h1>
        <p class="intro">
          Fünf Fragen. Je ungewöhnlicher deine richtige Antwort,
          desto höher steigt dein Ballon.
        </p>
        <div class="chips">
          <span>25 Sekunden pro Frage</span>
          <span>5 Fragen</span><span>Max. 500 Punkte</span>
        </div>
        <section class="card">
          <p class="eyebrow">${esc(formatDate(key))}</p>
          <h2>Dein heutiger Aufstieg</h2>
          <p>Der Timer beginnt beim Start.
          Nach jeder Frage kannst du dein Ergebnis in Ruhe ansehen.</p>
          ${action}
        </section>
        <div class="stats">
          <div class="stat"><strong>${s.streak}</strong><span>Tage in Serie</span></div>
          <div class="stat"><strong>${s.played}</strong><span>Runden</span></div>
          <div class="stat"><strong>${s.best}</strong><span>Rekord</span></div>
        </div>
        <p class="muted">
          Die Tagessperre gilt nur in diesem Browser.
          Löschen von Browserdaten kann sie umgehen.
        </p>
      </section>
      ${worldMarkup(day ? total(day) : 0)}
    </div>`;
  setWorld(day ? total(day) : 0);
}

function play() {
  const key = today();
  const day = state.days[key];

  if (!day) {view="home"; home(); return;}
  if (day.finished) {selectedDate=key; result(); return;}
  if (day.phase === "feedback") {feedback(day); return;}

  const index = day.answers.length;
  const q = day.questions[index];

  app.innerHTML = `
    <div class="grid">
      <section>
        <div class="time-head">
          <p class="eyebrow">Frage ${index+1} von 5</p>
          <span class="timer" id="seconds" role="timer"
            aria-label="Verbleibende Sekunden">25 s</span>
        </div>
        <div class="time-track">
          <div class="time-fill" id="time-fill"></div>
        </div>
        <section class="card">
          <h1 class="question">${esc(q.text)}</h1>
          <form id="answer-form">
            <label for="answer">Deine Antwort</label>
            <input id="answer" maxlength="120" autocomplete="off"
              spellcheck="false">
            <button class="primary" type="submit">Antwort prüfen</button>
            <button class="secondary" type="button"
              data-action="skip">Überspringen</button>
            <div id="suggestion" aria-live="polite"></div>
          </form>
          <p class="muted">
            Richtige Schreibweisen werden direkt abgegeben.
            Bei einem Korrekturvorschlag entscheidest du.
            Der Timer läuft dabei weiter.
          </p>
        </section>
        <p class="muted">
          Groß- und Kleinschreibung sowie ö/oe, ä/ae und ü/ue
          sind bei hinterlegten Antworten gleichwertig.
        </p>
      </section>
      ${worldMarkup(total(day))}
    </div>`;

  setWorld(total(day));

  document.getElementById("answer-form").addEventListener(
    "submit",event => {
      event.preventDefault();
      checkAnswer(key,index);
    }
  );

  document.getElementById("answer").addEventListener("input",() => {
    candidate = null;
    document.getElementById("suggestion").replaceChildren();
  });

  document.getElementById("answer").focus();

  const tick = () => {
    if (today() !== key) {
      expireOldDays();
      navigate("home");
      toast("Ein neuer Spieltag hat begonnen.");
      return;
    }

    const remaining = Math.max(0,day.deadline-Date.now());
    const seconds = Math.ceil(remaining/1000);
    const label = document.getElementById("seconds");
    const bar = document.getElementById("time-fill");
    if (!label || !bar) return;

    label.textContent = seconds+" s";
    label.classList.toggle("urgent",seconds<=5);
    bar.classList.toggle("urgent",seconds<=5);
    bar.style.width = Math.min(100,remaining/25000*100)+"%";

    if (remaining <= 0) {
      commitAnswer(key,index,"",null,"timeout");
    }
  };

  tick();
  if (view === "play" && day.phase === "question") {
    timer = setInterval(tick,100);
  }
}

function checkAnswer(key,index) {
  const day = state.days[key];
  if (!day || day.phase !== "question") return;

  if (Date.now() >= day.deadline) {
    commitAnswer(key,index,"",null,"timeout");
    return;
  }

  const raw = document.getElementById("answer").value.trim();
  const q = day.questions[index];

  if (!raw) {
    commitAnswer(key,index,"",null,"skip");
    return;
  }

  const exact = exactAnswer(q,raw);
  if (exact) {
    commitAnswer(key,index,raw,exact,"answer");
    return;
  }

  const suggestion = similarAnswer(q,raw);

  if (suggestion) {
    candidate = {key,index,raw,answer:suggestion};
    document.getElementById("suggestion").innerHTML = `
      <div class="suggestion">
        <p>Meinst du <strong>${esc(suggestion[0])}</strong>?</p>
        <button type="button" class="primary" data-action="accept">
          Korrigiert abgeben
        </button>
        <button type="button" class="secondary" data-action="original">
          Original abgeben
        </button>
        <p class="muted">Die 25 Sekunden laufen weiter.</p>
      </div>`;
    return;
  }

  commitAnswer(key,index,raw,null,"answer");
}

function commitAnswer(key,index,raw,answer,reason) {
  if (locked) return;
  locked = true;
  clearTimers();

  const fresh = load();

  if (!storageOK) {
    locked = false;
    render();
    return;
  }

  state = fresh;
  const day = state.days[key];

  if (!day || day.finished || day.phase !== "question" ||
      day.answers.length !== index) {
    locked = false;
    render();
    return;
  }

  if (today() !== key) {
    expireOldDays();
    locked = false;
    navigate("home");
    return;
  }

  if (Date.now() >= day.deadline) {
    raw = "";
    answer = null;
    reason = "timeout";
  }

  const before = total(day);

  day.answers.push({
    raw,
    canonical:answer ? answer[0] : "",
    points:answer ? answer[1] : 0,
    reason
  });

  day.phase = "feedback";
  day.deadline = null;

  if (!save()) {
    state = fresh;
    locked = false;
    render();
    return;
  }

  candidate = null;
  locked = false;
  view = "play";
  feedback(day,before);
}

function feedback(day,from = total(day)) {
  const index = day.answers.length-1;
  const answer = day.answers[index];
  const q = day.questions[index];
  const height = total(day);

  const title = answer.reason === "timeout" ? "Die Zeit ist abgelaufen." :
    answer.canonical ? "Deine Antwort ist richtig." :
    answer.reason === "skip" ? "Frage übersprungen." :
    "Diese Antwort wurde nicht erkannt.";

  const next = day.answers.length === 5
    ? "Gesamtergebnis ansehen"
    : "Nächste Frage starten · 25 s";

  app.innerHTML = `
    <div class="grid">
      <section>
        <p class="eyebrow">Auswertung · Frage ${index+1} von 5</p>
        <section class="card">
          <h2>${esc(title)}</h2>
          <p>${esc(q.text)}</p>
          <p>Deine Antwort:
            <strong>${esc(answer.raw || "Leer")}</strong>
          </p>
          ${answer.canonical ?
            `<p class="muted">Gewertet als: ${esc(answer.canonical)}</p>` : ""}
          <div class="points">+${answer.points}<small> Punkte</small></div>
          <span class="badge ${answer.points ? "" : "zero"}">
            ${esc(LEVELS[answer.points])}
          </span>
          <p>
            ${answer.points
              ? `Du steigst um ${answer.points} Meter auf.`
              : "Dein Ballon bleibt auf der bisherigen Höhe."}
          </p>
          <p class="muted">
            Bisher ${height} von 500 Punkten.
            Die Seltenheitsstufe ist redaktionell festgelegt.
          </p>
          <button class="primary" data-action="next">${next}</button>
          <p class="muted">
            Hier läuft kein Timer.
            Die nächste Frage beginnt erst mit deinem Klick.
          </p>
        </section>
      </section>
      ${worldMarkup(from)}
    </div>`;

  animateWorld(from,height);
}

function nextQuestion() {
  state = load();
  const key = today();
  const day = state.days[key];

  if (!day || day.phase !== "feedback") {
    render();
    return;
  }

  if (day.answers.length === 5) {
    day.finished = true;
    day.phase = "done";
    selectedDate = key;
    if (save()) navigate("result");
  } else {
    day.phase = "question";
    day.deadline = Date.now()+25000;
    if (save()) navigate("play");
  }
}

function result() {
  const key = selectedDate || today();
  const day = state.days[key];
  if (!day?.finished) {view="home"; home(); return;}

  const rows = day.questions.map((q,i) => {
    const answer = day.answers[i];
    return `
      <article class="result-row">
        <p class="eyebrow">Frage ${i+1}</p>
        <h3>${esc(q.text)}</h3>
        <p>${esc(answer.raw || "Leer")} · ${answer.points} Punkte</p>
        <span class="badge ${answer.points ? "" : "zero"}">
          ${answer.reason === "timeout" ? "Zeit abgelaufen" :
            answer.reason === "day-end" ? "Spieltag beendet" :
            esc(LEVELS[answer.points])}
        </span>
      </article>`;
  }).join("");

  app.innerHTML = `
    <div class="grid">
      <section>
        <p class="eyebrow">${esc(formatDate(key))}</p>
        <h1>Dein Aufstieg.</h1>
        <div class="points">${total(day)}<small> / 500 Punkte</small></div>
        <p>Du hast ${total(day)} Meter erreicht.</p>
        <button class="primary" data-action="share">Ergebnis kopieren</button>
        <button class="secondary" data-view="stats">Meine Statistik</button>
        <section class="card">${rows}</section>
        <p class="notice">
          Ein echter Vergleich mit anderen Spielern benötigt
          eine gemeinsame Datenbank. In dieser Version ist er
          noch nicht verfügbar.
        </p>
      </section>
      ${worldMarkup(total(day))}
    </div>`;
  setWorld(total(day));
}

function statistics() {
  const s = stats();
  app.innerHTML = `
    <p class="eyebrow">Nur in diesem Browser</p>
    <h1>Deine Statistik.</h1>
    <div class="stats">
      <div class="stat"><strong>${s.streak}</strong><span>Tage in Serie</span></div>
      <div class="stat"><strong>${s.best}</strong><span>Rekord</span></div>
      <div class="stat"><strong>${s.average}</strong><span>Durchschnitt</span></div>
    </div>
    <section class="card">
      <h2>Vergangene Aufstiege</h2>
      ${completed().map(([key,day]) => `
        <div class="result-row">
          <p>${esc(formatDate(key))} · ${total(day)} Punkte</p>
          <button class="secondary" data-result="${key}">Ansehen</button>
        </div>`).join("") || "<p>Noch keine abgeschlossene Tagesrunde.</p>"}
    </section>
    <p class="muted">
      Ein freiwilliges Onlinekonto ist noch nicht verbunden.
      Browserdaten löschen entfernt auch deine lokale Statistik.
    </p>`;
}

function rules() {
  app.innerHTML = `
    <p class="eyebrow">So funktioniert es</p>
    <h1>Fünf Fragen.<br>Hoch hinaus.</h1>
    <section class="card">
      <h2>25 Sekunden pro Frage</h2>
      <p>
        Die erste Frage beginnt beim Start der Runde.
        Weitere Fragen beginnen mit „Nächste Frage starten“.
        Der Timer läuft auch beim Wechseln des Tabs oder Neuladen weiter.
        Zeitablauf bedeutet leere Antwort und 0 Punkte.
      </p>
      <h2>Sofortiges Ergebnis</h2>
      <p>
        Nach jeder Abgabe erhältst du deine Wertung.
        Du kannst sie ohne Zeitdruck ansehen.
        Jede abgegebene Antwort ist endgültig.
      </p>
      <h2>Seltene Antworten steigen höher</h2>
      <p>
        Häufig: 10, bekannt: 25, ungewöhnlich: 50,
        selten: 75, sehr selten: 100 Punkte.
        Ein Punkt entspricht einem Meter Aufstieg.
      </p>
      <p class="muted">
        Die Stufen sind redaktionell geschätzt, nicht aus echten
        Spielerantworten berechnet. Nicht jede Frage enthält jede Stufe.
      </p>
      <h2>Schreibweisen und Korrektur</h2>
      <p>
        Groß- und Kleinschreibung, überflüssige Leerzeichen sowie
        Umlaute und ihre ae/oe/ue-Schreibweisen werden normalisiert.
        Hinterlegte Synonyme werden ebenfalls akzeptiert.
      </p>
      <p>
        Für nahe Schreibweisen gibt es einen bestätigungspflichtigen
        Vorschlag. Sehr kurze und mehrdeutige Eingaben werden nicht
        automatisch verbessert. Der Timer pausiert dabei nicht.
      </p>
      <h2>Jeden Tag eine Runde</h2>
      <p>
        Tageswechsel ist um Mitternacht in Europe/Berlin.
        Alle erhalten für dasselbe Datum dieselben Fragen.
        Fehlende Antworten angefangener alter Runden zählen als 0.
      </p>
      <p>
        Eine Serie zählt aufeinanderfolgende abgeschlossene
        Tagesversuche, auch mit 0 Punkten.
      </p>
    </section>
    <details class="card">
      <summary>Technische Grenzen</summary>
      <p>
        Dieser lokale Prototyp ist nicht manipulationssicher.
        Browserdaten, Uhrzeit und Quellcode lassen sich verändern.
        Auch mehrere Tabs sind keine verlässliche Teilnahmesperre.
      </p>
      <p>
        Es gibt keine globale Rangliste oder echten Onlinekonten.
        Der kleine Fragenpool wiederholt sich.
        Antwortlisten und Korrekturvorschläge können unvollständig sein.
      </p>
    </details>`;
}

function render() {
  clearTimers();
  expireOldDays();

  if (view === "play") play();
  else if (view === "result") result();
  else if (view === "stats") statistics();
  else if (view === "rules") rules();
  else home();

  /*
    Wenn eine Frage läuft, muss ihr Ablauf auch auf einer anderen
    Ansicht berücksichtigt werden. Die Frist selbst bleibt gespeichert.
  */
  if (view !== "play") {
    timer = setInterval(checkBackgroundDeadline,250);
  }
}

function checkBackgroundDeadline() {
  const day = state.days[today()];
  if (day && !day.finished && day.phase === "question" &&
      Date.now() >= day.deadline) {
    commitAnswer(today(),day.answers.length,"",null,"timeout");
  }
}

async function share() {
  const key = selectedDate || today();
  const day = state.days[key];
  if (!day?.finished) return;

  const text = [
    "Gazillion · "+formatDate(key),
    total(day)+"/500 Punkte · "+total(day)+" Meter",
    day.answers.map(a => a.points).join(" · ")
  ].join("\n");

  try {
    await navigator.clipboard.writeText(text);
    toast("Ergebnis kopiert.");
  } catch (error) {
    window.prompt("Ergebnis kopieren:",text);
  }
}

document.addEventListener("click",event => {
  const viewButton = event.target.closest("[data-view]");
  if (viewButton) {
    navigate(viewButton.dataset.view);
    return;
  }

  const resultButton = event.target.closest("[data-result]");
  if (resultButton) {
    selectedDate = resultButton.dataset.result;
    navigate("result");
    return;
  }

  const button = event.target.closest("[data-action]");
  if (!button) return;
  const action = button.dataset.action;

  if (action === "start") start();
  else if (action === "next") nextQuestion();
  else if (action === "share") share();
  else if (action === "skip") {
    const key = today();
    const day = state.days[key];
    if (day) commitAnswer(key,day.answers.length,"",null,"skip");
  } else if (action === "accept" && candidate) {
    const c = candidate;
    commitAnswer(c.key,c.index,c.answer[0],c.answer,"corrected");
  } else if (action === "original" && candidate) {
    const c = candidate;
    commitAnswer(c.key,c.index,c.raw,null,"answer");
  }
});

window.addEventListener("storage",event => {
  if (event.key === KEY) {
    state = load();
    candidate = null;
    render();
  }
});

document.addEventListener("visibilitychange",() => {
  if (!document.hidden) {
    state = load();
    render();
  }
});

window.addEventListener("resize",() => {
  const day = state.days[
    view === "result" ? selectedDate || today() : today()
  ];
  setWorld(day ? total(day) : 0);
});

let lastDay = today();
setInterval(() => {
  const key = today();
  if (key !== lastDay) {
    lastDay = key;
    expireOldDays();
    if (view === "play") view = "home";
    render();
    toast("Ein neuer Spieltag hat begonnen.");
  }
},1000);

render();
</script>
</body>
</html>
